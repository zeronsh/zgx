[package]
name = "bevy-compare-anim"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace: nothing here is a dependency of any zgx crate. Bevy
# as the `bevy` arm pins it (0.19.1), with its animation and glTF loader.
[workspace]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "3d_bevy_render", "default_app", "std", "multi_threaded",
    "png", "jpeg", "bevy_animation", "bevy_gltf",
] }

[profile.release]
lto = "fat"
codegen-units = 1
