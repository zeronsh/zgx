[package]
name = "zgx-video"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true
# Held from crates.io for now: used from the repository (docs/releasing.md).
publish = false
description = "Programmatic video for zgx: an interface played on a virtual clock, rendered frame by frame to a video file, with a studio to preview it. Optional: an app that doesn't depend on it pays nothing."
keywords = ["gui", "video", "animation", "motion-graphics", "luau"]
categories = ["multimedia::video", "rendering"]

[features]
default = ["window", "3d"]
# 3D scenes in a video (zgx-script's `scene3d`: `ui.scene3d`, `ui.mesh`,
# `ui.light`) and glTF models in them (`gltf`: `ui.model`), drawn with
# zgx-3d.
3d = ["zgx-script/gltf"]
# `zgx video studio` in a window. Without it, the studio has only its headless
# picture, and the crate doesn't link the desktop.
window = ["dep:zgx-run"]

[dependencies]
zgx-run = { path = "../zgx-run", version = "0.2.0", optional = true, default-features = false, features = ["fetch"] }
zgx = { path = "../zgx", version = "0.2.0", default-features = false }
zgx-gpu = { path = "../zgx-gpu", version = "0.2.0" }
zgx-script = { path = "../zgx-script", version = "0.2.0" }
serde_json = "1"
png = "0.18"
gif = { version = "=0.14.2", default-features = false, features = ["std", "color_quant"] }

[dev-dependencies]
# The perf gate's output check, called by the gate benches each frame.
zgx-fingerprint = { path = "../../scripts/perf/fingerprint" }
# The instruction gate's `video` cell draws with wgpu's no-op backend
# (`ZGX_GPU_NOOP`): the gate builds zgx-video's bench apart from the others.
wgpu = { version = "29.0.4", default-features = false, features = ["noop"] }

[[bin]]
name = "zgx-video"
path = "src/bin/zgx-video.rs"

# Native encoding and decoding on macOS (AVFoundation, on VideoToolbox's
# hardware): no ffmpeg for H.264, HEVC and ProRes.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary", "NSValue", "NSError", "NSObject", "NSArray"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "block2", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMTime"] }
