[package]
name = "zgx-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true
description = "Sound for zgx apps: a sample-accurate mixer with buses, fades and a limiter, WAV files, and an offline renderer. Optional: an app that doesn't depend on it pays nothing."
keywords = ["audio", "mixer", "sound", "gamedev", "gui"]
categories = ["multimedia::audio", "game-development"]

[features]
# The system's default output: through cpal today on every platform. The
# feature names what it gives, not how, so a platform's backend can change
# without apps changing features.
device = ["dep:cpal"]
# Ogg Vorbis, loaded whole or streamed: lewton, pure Rust (MIT/Apache).
vorbis = ["dep:lewton"]
# AAC (MP4/M4A, ADTS), through the platform's own decoder: AudioToolbox
# on macOS, no crate added. Elsewhere it builds, and AAC is an error that
# says the platform has none yet.
aac = []
# Binaural sound for headphones: effects::Binaural, a partitioned
# convolution with a spherical head made in code, or the app's own measured
# head-related impulse responses (HrtfSet). No dependency, no data.
hrtf = []

[dependencies]
cpal = { version = "0.18.2", optional = true, default-features = false }
lewton = { version = "0.10.2", optional = true }

# The audio thread's rules: a counting allocator, so a process of its own,
# and no test harness, so no other thread.
[[test]]
name = "realtime"
harness = false

[[example]]
name = "device_probe"
required-features = ["device"]
