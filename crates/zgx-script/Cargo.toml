[package]
# Integration tests build as a few binaries by area (see AGENTS.md).
autotests = false
name = "zgx-script"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords = ["gui", "luau", "scripting", "hot-reload", "ui"]
categories = ["gui", "development-tools"]
description = "Luau scripts that describe zgx component trees, with hot reload."

[features]
# Image formats (see zgx-gpu): all by default.
default = ["components", "svg", "png", "jpeg", "gif", "cjk-thai-words"]
# Test-only hooks in `zgx test` (none in a default build): a delay an
# environment variable names, to land a signal in a window on purpose.
test-hooks = []
# Words in Chinese, Japanese and Thai by dictionary (zgx's `cjk-thai-words`).
cjk-thai-words = ["zgx/cjk-thai-words"]
# The component library's `ui.*` (zgx-components): the data grid, tree,
# dates and times, combobox, select, tabs, toasts, command palette and
# controls.
components = ["dep:zgx-components"]
# `ui.scene3d` and its objects (`ui.mesh`, `ui.light`, `ui.group`): 3D
# scenes drawn with zgx-3d. Off by default: it links the renderer (wgpu),
# which a headless host (tests, tools, a server) would not otherwise.
# zgx-run turns it on, so apps it runs have it.
scene3d = ["dep:zgx-3d"]
# Localized messages' plural rules and numbers for every locale (zgx's
# `i18n`, ICU4X's data: about 90 KB). Off by default: `ui.t` reaches the
# formatters, so a host would carry them whether or not its scripts call
# it. Without it `ui.i18n` and `ui.t` work, with English's plural rules
# (`one`, `other`) and numbers as Rust writes them. zgx-run turns it on.
i18n = ["zgx/i18n"]
# `ui.model`: glTF 2.0 models (`.glb`, `.gltf`) in 3D scenes, read by
# zgx-3d's `gltf`.
gltf = ["scene3d", "zgx-3d/gltf"]
svg = ["zgx-gpu/svg"]
png = ["zgx-gpu/png"]
jpeg = ["zgx-gpu/jpeg"]
gif = ["zgx-gpu/gif"]
# Windows: Vulkan where Direct3D 12 has no adapter (see zgx-gpu).
vulkan = ["zgx-gpu/vulkan"]
# Devtools for agents (`zgx_script::inspect`): a running app answers
# `zgx inspect` over a user-only local socket when its host serves it. Off
# by default: an app shipped without it cannot be driven. zgx-run turns it
# on for development.
inspect = ["zgx/trace", "dep:png"]

[dependencies]
zgx = { path = "../zgx", version = "0.1.10", default-features = false }
zgx-components = { path = "../zgx-components", version = "0.1.10", optional = true }
zgx-3d = { path = "../zgx-3d", version = "0.1.10", optional = true }
# Image decoding for `ui.image` (PNG, JPEG).
mlua = { package = "zgx-mlua", version = "0.12.9", path = "../../vendor/mlua", features = ["luau"] }
memchr = "2.7"
# `.luaurc` aliases for `require("@alias/...")`.
serde = "1"
serde_json = "1"
# Markdown for `ui.markdown` and `zgx_script::markdown`.
pulldown-cmark = { version = "0.13", default-features = false }
unicase = "2"
smallvec = "1.16"
# Small integer keys (nodes) hashed by a multiply, not SipHash.
rustc-hash = "2.1"
# Devtools' snapshots (`inspect`).
png = { version = "0.18", optional = true }
# `zgx lint`'s plural cases: each locale's CLDR categories (`i18n-plural`),
# in every build. The formatters stay behind the `i18n` feature.
icu_plurals = { version = "~2.4", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "~2.4", default-features = false }

# The script time budget counts the thread's CPU time (clock_gettime).
# The renderer: not linked in the browser (wasm32), where zgx-dom shows
# views (`src/gpu.rs`).
# The browser's clock (`src/time.rs`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zgx-gpu = { path = "../zgx-gpu", version = "0.1.10", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Console"] }

[[bin]]
# `zgx check app.luau`: type checks scripts with luau-lsp (src/check.rs).
name = "zgx"
path = "src/bin/zgx.rs"
# Its docs would land where the zgx library's do.
doc = false

# Named apart from zgx-gpu's `layout_bench` and zgx-desktop's `web_view`:
# examples share one output directory, and Windows cannot link two
# executables (and their .pdb) to one path at once.
[[example]]
name = "script_layout_bench"
path = "examples/layout_bench.rs"

[[example]]
name = "script_web_view"
path = "examples/web_view.rs"

[[example]]
name = "scene3d"
required-features = ["scene3d"]

[dev-dependencies]
# The perf gate's output check, called by the gate benches each frame.
zgx-fingerprint = { path = "../../scripts/perf/fingerprint" }
zgx-desktop = { path = "../zgx-desktop" }
# The benchmark workload of the vlist_luau example.
zgx-workload = { path = "../../comparisons/workload" }

# CoreVideo frames for `ScriptHost::surface` (tests/host_surfaces.rs).
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"

[[test]]
name = "luau_pages"
path = "tests/luau_pages.rs"

[[test]]
# Its own process: it counts every allocation with a global allocator.
name = "memory_named"
path = "tests/memory_named.rs"

[[test]]
# Its own process: it points `TMPDIR` at a directory of its own.
name = "test_runner_temp"
path = "tests/test_runner_temp.rs"

[[test]]
# Its own process: it counts with `ZGX_PROFILE` (`zgx::profile::take`).
name = "md_chunk_flat"
path = "tests/md_chunk_flat.rs"

[[test]]
# Its own process: it counts with `ZGX_PROFILE` (`zgx::profile::take`).
name = "md_chunk_flat_render"
path = "tests/md_chunk_flat_render.rs"

[[test]]
# Its own process: what `compile_ahead` compiled is the process's.
name = "compile_ahead"
path = "tests/compile_ahead.rs"

[[test]]
# Its own process: the packages' compiled modules are the process's.
name = "package_bytecode"
path = "tests/package_bytecode.rs"

[[test]]
name = "anime"
path = "tests/anime/main.rs"

[[test]]
name = "examples"
path = "tests/examples/main.rs"

[[test]]
name = "state"
path = "tests/state/main.rs"

[[test]]
name = "tooling"
path = "tests/tooling/main.rs"

[[test]]
name = "ui"
path = "tests/ui/main.rs"

[[test]]
name = "soak"
path = "tests/soak.rs"

[[test]]
name = "streamed_memory"
path = "tests/streamed_memory.rs"

[[test]]
name = "bundle"
path = "tests/bundle.rs"

[[test]]
name = "reload_memory"
path = "tests/reload_memory.rs"
