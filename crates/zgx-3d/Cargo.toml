[package]
name = "zgx-3d"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true
description = "Retained 3D scenes for zgx: meshes, a camera, lights and a PBR material, drawn in a GPU view only when they change."
keywords = ["gui", "3d", "wgpu", "pbr", "zgx"]
categories = ["gui", "rendering"]

[dependencies]
zgx = { path = "../zgx", version = "0.1.10", default-features = false }
zgx-gpu = { path = "../zgx-gpu", version = "0.1.10", default-features = false, features = ["view-features"] }
bytemuck = { version = "1.25", features = ["derive"] }
# Compute: a sandboxed shader's loops bounded and written back as WGSL
# (`shader_sandbox`). The naga wgpu already builds, with its writer: no
# crate added.
naga = { version = "29.0.4", default-features = false, features = ["wgsl-out"], optional = true }
serde_json = { version = "1", optional = true }
# Zstandard-supercompressed KTX2 levels (the `ktx2` feature). MIT.
ruzstd = { version = "0.9", optional = true, default-features = false, features = ["std"] }
# Block-compressed KTX2 maps decoded to RGBA8 on a device without their
# format (the `ktx2` feature). MIT OR Apache-2.0, taken as MIT.
texture2ddecoder = { version = "0.1", optional = true }
# Basis Universal KTX2 textures transcoded (the `ktx2-basis` feature):
# pure Rust, no C or C++. Apache-2.0: an app turning it on ships its code,
# and lists its licence among its third-party notices. Its own Zstandard
# decoder is left out: this crate's decompresses levels first.
basisu = { version = "0.1", optional = true, default-features = false, features = ["std"] }
# Sound in the world (`World::add_emitter3d`): the audio engine, its
# spatial maths and offline renderer. Nothing of zgx's below it.
zgx-audio = { path = "../zgx-audio", version = "0.1.10", optional = true, default-features = false }

[features]
# glTF 2.0 models (`Model`, `World::add_model`): `.glb` and `.gltf` files,
# their textures PNG or JPEG.
gltf = ["dep:serde_json", "zgx-gpu/png", "zgx-gpu/jpeg"]
# KTX2 textures (`Texture::decode`, and glTF images that are KTX2 files):
# RGBA8 and block-compressed (BC, ETC2, EAC, ASTC) ones, their levels read
# as stored, Zstandard-supercompressed or not.
ktx2 = ["dep:ruzstd", "dep:texture2ddecoder"]
# Basis Universal KTX2 textures (ETC1S, UASTC; glTF's KHR_texture_basisu),
# transcoded on the texture threads to BC7 or ASTC where the device holds
# them, RGBA8 where not. Off by default: an app turning it on ships
# Apache-2.0 code (`basisu`, a port of Basis Universal's transcoder) and
# should list its licence among its third-party notices. +793 KB stripped.
ktx2-basis = ["ktx2", "dep:basisu"]
# The app's GPU data and compute passes (`World::add_buffer`,
# `add_texture`, `add_compute`): WGSL checked by the naga wgpu brings.
compute = ["dep:naga"]
# The lighting milestone (design-3d-aaa.md, 6.3): clustered lights.
lighting = []
# Particle emitters (`World::add_emitter`): updated by compute where the
# device runs it, on the CPU elsewhere.
particles = ["compute"]
# Global illumination: irradiance probe volumes (`World::add_probes`),
# filled by ray queries where the device has them.
gi = []
# Sound in the world (design-audio.md, 7): emitters on objects, the
# listener on the camera, occlusion by the meshes, reverb zones.
audio = ["dep:zgx-audio"]
# Binaural emitters (`Emitter3d::binaural`): heard through a head (HRTF).
hrtf = ["audio", "zgx-audio/hrtf"]

# Custom materials (`MaterialShader`, `World::add_shader`, surface layers):
# WGSL functions plugged into the lit pipeline. Off, a world draws as
# without them, and none of their code is built.
shaders = []
# The post chain (`World::set_post`): a scene target in linear light, bloom.
post = []

[dev-dependencies]
zgx-desktop = { path = "../zgx-desktop", default-features = false }
# `world_bench` draws by the no-op backend. The gate builds this crate alone
# (Cargo would turn it on for every bench built beside it).
wgpu = { version = "29.0.4", default-features = false, features = ["noop"] }
# The reference images (tests/reference.rs): already in the tree, by `image`.
png = "0.18"

[[example]]
name = "model"
required-features = ["gltf"]

[[example]]
name = "particles_bench"
required-features = ["particles"]

[[test]]
name = "ktx2"
required-features = ["ktx2", "gltf"]

# Its renderer's device made before any world asks for compressed
# textures: a process of its own (the request is the process's).
[[test]]
name = "ktx2_plain"
required-features = ["ktx2", "gltf"]

[[test]]
name = "shaders"
required-features = ["shaders"]

[[test]]
name = "gi"
required-features = ["gi"]

[[test]]
name = "audio"
required-features = ["audio"]

[[test]]
name = "settle_compile"
required-features = ["shaders"]

[[test]]
name = "shader_compile"
required-features = ["shaders"]

[[example]]
name = "audio_occlusion"
required-features = ["audio"]

[[example]]
name = "post_bench"
required-features = ["post"]

[[example]]
name = "audio_scene"
required-features = ["audio"]
