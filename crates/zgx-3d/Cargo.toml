[package]
name = "zgx-3d"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true
description = "Retained 3D scenes for zgx: meshes, a camera, lights and a PBR material, drawn in a GPU view only when they change."
keywords = ["gui", "3d", "wgpu", "pbr", "zgx"]
categories = ["gui", "rendering"]

[dependencies]
zgx = { path = "../zgx", version = "0.1.10", default-features = false }
zgx-gpu = { path = "../zgx-gpu", version = "0.1.10", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
# Compute: a sandboxed shader's loops bounded and written back as WGSL
# (`shader_sandbox`). The naga wgpu already builds, with its writer: no
# crate added.
naga = { version = "29.0.4", default-features = false, features = ["wgsl-out"], optional = true }
serde_json = { version = "1", optional = true }

[features]
# glTF 2.0 models (`Model`, `World::add_model`): `.glb` and `.gltf` files,
# their textures PNG or JPEG.
gltf = ["dep:serde_json", "zgx-gpu/png", "zgx-gpu/jpeg"]
# The app's GPU data and compute passes (`World::add_buffer`,
# `add_texture`, `add_compute`): WGSL checked by the naga wgpu brings.
compute = ["dep:naga"]
# The lighting milestone (design-3d-aaa.md, 6.3): clustered lights.
lighting = []
# Particle emitters (`World::add_emitter`): updated by compute where the
# device runs it, on the CPU elsewhere.
particles = ["compute"]
# Global illumination: irradiance probe volumes (`World::add_probes`),
# filled by ray queries where the device has them.
gi = []

# Custom materials (`MaterialShader`, `World::add_shader`, surface layers):
# WGSL functions plugged into the lit pipeline. Off, a world draws as
# without them, and none of their code is built.
shaders = []

[dev-dependencies]
zgx-desktop = { path = "../zgx-desktop", default-features = false }
# `world_bench` draws by the no-op backend. The gate builds this crate alone
# (Cargo would turn it on for every bench built beside it).
wgpu = { version = "29.0.4", default-features = false, features = ["noop"] }
# The reference images (tests/reference.rs): already in the tree, by `image`.
png = "0.18"

[[example]]
name = "model"
required-features = ["gltf"]

[[example]]
name = "particles_bench"
required-features = ["particles"]

[[test]]
name = "shaders"
required-features = ["shaders"]

[[test]]
name = "gi"
required-features = ["gi"]
