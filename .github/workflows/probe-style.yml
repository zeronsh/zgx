# PROBE, not for merging: style_bench's x86 count of mount_style_with_intrinsic's
# closure#10 at v0.1.6, each candidate commit and v0.1.7 (#1276).
name: probe-style
on:
  push:
    branches: ['probe/style-x86-lines']
jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends valgrind cmake pkg-config fonts-dejavu-core libdbus-1-dev libfontconfig1-dev libwayland-dev libxcb1-dev libxkbcommon-dev libxrandr-dev
      - name: count each commit
        run: |
          set -eux
          mkdir -p out
          cc -O2 -shared -fPIC -o out/same_run.so scripts/perf/same_run.c
          git worktree add -q --detach ../w e077e952f63030808a098ca54f3e69501e3271bd
          for sha in b62df3943 fead9fca9; do
            ( cd ../w && git checkout -q --detach "$sha" && CARGO_INCREMENTAL=0 CARGO_PROFILE_RELEASE_DEBUG=0 CARGO_TARGET_DIR="$PWD/../t" \
                cargo build --release --locked -q -p zgx --example style_bench )
            ( cd /tmp && env -i PATH="$PATH" HOME="$HOME" LD_PRELOAD="$GITHUB_WORKSPACE/out/same_run.so" ZGX_GATE=1 ZGX_ASSISTIVE=0 \
                setarch -R valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file="$GITHUB_WORKSPACE/out/$sha.cg" \
                "$GITHUB_WORKSPACE/../t/release/examples/style_bench" > /dev/null 2> "$GITHUB_WORKSPACE/out/$sha.err" )
            total=$(grep -E 'I *refs' "out/$sha.err" | tr -d , | awk '{print $NF}')
            c10=$(cg_annotate --threshold=100 "out/$sha.cg" | grep -F 'mount_style_with_intrinsic::{closure#10}' | grep -v -e drop_glue -e bind_marked | head -1 | awk '{print $1}' | tr -d ,)
            echo "RESULT $sha total=$total closure10=$c10" | tee -a out/results.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: style-chain
          path: out/results.txt
