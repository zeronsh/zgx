name: Rust
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!site/**"
      - "!website/**"
      - "!.github/workflows/site.yml"
      - "!**/*.md"
      # Markdown compiled as doctests.
      - "README.md"
      - "docs/3d.md"
      - "docs/composition.md"
      - "docs/i18n.md"
      - "docs/styling.md"
      - "docs/window-controls.md"
  pull_request:
    paths:
      - "**"
      - "!site/**"
      - "!website/**"
      - "!.github/workflows/site.yml"
      - "!**/*.md"
      # Markdown compiled as doctests.
      - "README.md"
      - "docs/3d.md"
      - "docs/composition.md"
      - "docs/i18n.md"
      - "docs/styling.md"
      - "docs/window-controls.md"
# A newer push to a PR supersedes its running check. On main every run
# finishes (a full signal per commit, and the caches it saves); a newer
# push waits, replacing any run still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# Dozens of desktop fixtures link the renderer; keep runner disk bounded.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  # Checks, unit tests, Vulkan rendering and every native Linux probe in one
  # job: the examples the tests build are the probes' fixtures.
  linux:
    runs-on: ubuntu-latest
    # A cold cache (a release's version bump changes Cargo.lock) takes about
    # twice a warm one's 21 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Room on the disk: this job's target/ reaches about 40 GB, more than
      # some runners have left after their image (two runs died of a full
      # disk on Oct 31). The image's toolchains it never runs (Android, .NET,
      # Haskell, Swift, CodeQL, PowerShell: about 28 GB) go while it builds.
      - run: |
          df -h /
          sudo nohup rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/powershell > /dev/null 2>&1 &
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # A fork changed without a version fails here, on its own pull request,
      # not at the release. A second or two: no build.
      - run: python3 scripts/check_forks.py --offline-ok
      # Ubuntu mirrors are sometimes very slow; reuse last month's .debs.
      - id: apt-key
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: apt-cache
        with:
          path: ~/apt-archives
          key: apt-${{ runner.arch }}-${{ steps.apt-key.outputs.month }}-${{ hashFiles('.github/linux-packages.txt') }}
          # A changed package list still starts from the last month's .debs.
          restore-keys: apt-${{ runner.arch }}-
      # A stalled mirror fails fast and retries rather than holding the job;
      # the whole install is tried three times before the job gives up.
      - name: Linux packages
        id: linux-packages
        timeout-minutes: 15
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          if [ -d ~/apt-archives ]; then sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/; fi
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for attempt in 1 2 3; do
            if sudo apt-get update -qq $apt &&
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $apt $(grep -v '^#' .github/linux-packages.txt); then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::apt-get couldn't install .github/linux-packages.txt in three tries"
              exit 1
            fi
            echo "::warning::apt-get failed (try $attempt of 3); trying again"
            sleep 20
          done
          mkdir -p ~/apt-archives && cp /var/cache/apt/archives/*.deb ~/apt-archives/
      - uses: actions/cache/save@v4
        if: steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Benchmark sampler failure evidence
        run: python3 scripts/test_compare.py -v
      - name: Which windows the Windows probes' guard takes as their app's
        run: python3 scripts/test_windows_guard.py -v
      - name: The release check's semver verdict
        run: python3 scripts/test_semver_verdict.py -v
      - name: The probes' Xvfb goes with what started it
        run: python3 scripts/test_xvfb_retry.py -v
      - name: The instruction gate counts each binary warm, with a cache of its own
        run: python3 scripts/perf/test_gate.py -v
      - name: The inlining check reads MIR and fails on #1740's and #1824's changes
        run: python3 scripts/perf/test_inline_scopes.py -v
      - run: cargo fmt --all -- --check
      # Every Luau script in the repository (examples and probes too), as
      # stylua.toml and .styluaignore have them.
      # StyLua and luau-lsp kept between runs, and fetched with retries when
      # missing (`fetch_release.sh`): a release download that times out
      # (HTTP 504) failed the job before a test ran.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/stylua-2.6.0
            ~/.local/luau-lsp-1.70.1
          key: luau-tools-stylua-2.6.0-luau-lsp-1.70.1-linux-x86_64
      - name: Luau format
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$HOME/.local/stylua-2.6.0"
          if [ ! -x "$dir/stylua" ]; then
            mkdir -p "$dir"
            scripts/fetch_release.sh JohnnyMorganz/StyLua v2.6.0 stylua-linux-x86_64.zip "$dir.zip"
            unzip -q -o "$dir.zip" -d "$dir"
            chmod +x "$dir/stylua"
          fi
          "$dir/stylua" --check .
      - run: cargo clippy --workspace --all-targets --features zgx-desktop/webkitgtk --locked -- -D warnings
      # Feature gating stays honest: the crates build without their defaults,
      # on the oldest Rust they claim (`rust-version`): a check this job
      # makes anyway, so the minimum costs only the toolchain's download.
      - name: No default features, on the minimum Rust
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          cargo "+$msrv" check -p zgx-components -p zgx-desktop -p zgx-script --no-default-features --locked
      # Lints too: code only a default feature uses (the component
      # library's) is left out with it, not left unused.
      - run: cargo clippy -p zgx-script --no-default-features --all-targets --locked -- -D warnings
      # zgx-script's best-practice lint over every example script.
      - name: Script lint
        run: cargo run -q -p zgx-script --bin zgx --locked -- lint crates/zgx-script/examples crates/zgx-desktop/examples crates/zgx-fx/examples/gallery
      # Every example script type checks (luau-lsp, the shipped ui/anime
      # types); zgx-script's check tests run with it too.
      - name: Script type check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$HOME/.local/luau-lsp-1.70.1"
          if [ ! -x "$dir/luau-lsp" ]; then
            mkdir -p "$dir"
            scripts/fetch_release.sh JohnnyMorganz/luau-lsp 1.70.1 luau-lsp-linux-x86_64.zip "$dir.zip"
            unzip -q -o "$dir.zip" -d "$dir"
            chmod +x "$dir/luau-lsp"
          fi
          echo "LUAU_LSP=$dir/luau-lsp" >> "$GITHUB_ENV"
          LUAU_LSP="$dir/luau-lsp" cargo run -q -p zgx-script --bin zgx --locked -- check crates/zgx-script/examples crates/zgx-desktop/examples crates/zgx-fx/examples/gallery
      # With 3D scenes (zgx-script's `scene3d`, off by default; the Windows
      # and macOS jobs test without it).
      - run: cargo test -p zgx -p zgx-components -p zgx-desktop -p zgx-workload -p zgx-script --all-targets --features zgx-script/scene3d --locked
      # Terminal sessions on real ptys (openpty, ConPTY): exact cells, input, exits.
      - run: cargo test -p zgx-terminal --locked
      # The optional effects package: every effect drawn, on each job's backend.
      - run: cargo test -p zgx-fx --locked
      # zgx-script's tests with all its features, as an app built by zgx-run
      # has them (scene3d, i18n, gltf, inspect): ICU's plural rules change
      # what the i18n lint finds, and each feature may add lazy `ui`
      # modules (`lazy_ui::` checks each against what its maker sets).
      - run: cargo test -p zgx-script --all-features --locked
      # zgx audit over the Luau examples (zgx-run's own tests need sockets).
      - run: cargo test -p zgx-run --test audit --locked
      # Devtools tracing (zgx's `trace`, off by default; zgx-script's
      # `inspect` turns it on): what it keeps stays bounded. Quoted, as the
      # line below is.
      - run: "cargo test -p zgx --features trace --lib --locked -- trace::"
      # Words in Chinese, Japanese and Thai with `cjk-thai-words` off:
      # Unicode's word boundaries, as before the dictionaries.
      # Quoted: an unquoted `words:: ` would be read as a YAML key, and the
      # whole workflow would fail to load.
      - run: "cargo test -p zgx --no-default-features --lib --test editor --test text --locked -- words:: chinese_japanese_or_thai"
      - run: cargo test --workspace --doc --locked
      - run: cargo test -p zgx-3d --features gltf --doc --locked
      # The API docs build without a warning (a broken link, a name collision).
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # Concurrent device tests need Vulkan-Loader#1866; older distro loaders
      # can crash inside vkSetDebugUtilsObjectNameEXT. Keep debug/validation on.
      # The loader is built from pinned revisions, so it is kept between
      # runs until the script changes.
      - uses: actions/cache@v4
        id: vulkan-loader
        if: ${{ !cancelled() && steps.linux-packages.outcome == 'success' }}
        with:
          path: ~/zgx-vulkan-loader/build/loader
          key: vulkan-loader-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_vulkan_loader.sh') }}
      - name: Build private patched Vulkan loader
        if: ${{ !cancelled() && steps.linux-packages.outcome == 'success' && steps.vulkan-loader.outputs.cache-hit != 'true' }}
        run: scripts/build_vulkan_loader.sh ~/zgx-vulkan-loader
      - name: Use the private Vulkan loader
        if: ${{ !cancelled() && steps.linux-packages.outcome == 'success' }}
        run: printf 'LD_LIBRARY_PATH=%s/zgx-vulkan-loader/build/loader\n' "$HOME" >> "$GITHUB_ENV"
      # The GPU tests below draw on lavapipe, Mesa's software Vulkan. Without
      # it every one of them panics ("No suitable graphics adapter found"),
      # which hides the cause: say it once, here. They run after an earlier
      # failure (a test, clippy), not after a missing install.
      - name: The software Vulkan adapter
        id: adapter
        if: ${{ !cancelled() && steps.linux-packages.outcome == 'success' }}
        run: |
          if ! ls /usr/share/vulkan/icd.d/lvp_icd*.json >/dev/null 2>&1; then
            echo "::error::lavapipe's ICD (mesa-vulkan-drivers) isn't installed: /usr/share/vulkan/icd.d has $(ls /usr/share/vulkan/icd.d 2>&1 | tr '\n' ' ')"
            exit 1
          fi
          if ! vulkaninfo --summary > "$RUNNER_TEMP/vulkaninfo.txt" 2>&1 || ! grep -q llvmpipe "$RUNNER_TEMP/vulkaninfo.txt"; then
            cat "$RUNNER_TEMP/vulkaninfo.txt"
            echo "::error::the Vulkan loader (LD_LIBRARY_PATH=$LD_LIBRARY_PATH) finds no llvmpipe device"
            exit 1
          fi
          grep -E 'deviceName|driverName|apiVersion' "$RUNNER_TEMP/vulkaninfo.txt" | head -6
      - name: Vulkan rendering and damage readback
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        env:
          XDG_RUNTIME_DIR: /tmp
        run: |
          set -o pipefail
          cargo test -p zgx-gpu --locked 2>&1 | tee "$RUNNER_TEMP/zgx-vulkan-tests.log"
      # Its pixel tests pass without drawing where there's no GPU: here they
      # must have one (lavapipe).
      - name: 3D rendering
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        env:
          XDG_RUNTIME_DIR: /tmp
          ZGX_REQUIRE_GPU: "1"
        run: cargo test -p zgx-3d --features gltf --locked
      # Without ffmpeg, the tests of what it encodes pass by skipping: here it
      # must be there.
      - name: Video
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        env:
          XDG_RUNTIME_DIR: /tmp
        run: |
          ffmpeg -version > /dev/null
          ffprobe -version > /dev/null
          cargo test -p zgx-video --locked
      # The test binaries built above aren't run again: their room goes to
      # the probes' fixtures, about 13 GB of examples.
      - name: Room for the fixtures
        if: ${{ !cancelled() && steps.linux-packages.outcome == 'success' }}
        run: find target/debug/deps -maxdepth 1 -type f -executable ! -name '*.so' -delete
      - name: Build native fixtures
        id: native-fixtures
        if: ${{ !cancelled() && steps.linux-packages.outcome == 'success' }}
        # The examples the probes run, not every example (the test step
        # already compiled every one, as a test).
        run: |
          fixtures=$(python3 scripts/linux_smokes.py --fixtures)
          # `terminal` for terminal_pane, the engine-drawn terminal's probe.
          cargo build -p zgx-desktop --features terminal $fixtures --locked
          # Web views: the webkitgtk feature's probes (`web-view*`).
          cargo build -p zgx-desktop --example web_view_probe --example web_view_schemes --features webkitgtk --locked
          cargo build -p zgx-run --locked
          cargo test -p zgx-desktop --lib --no-run --locked
      # X11, Wayland, IME, clipboard, DPI, accessibility and input probes. Each
      # owns its display or compositor, so they run side by side, eight at
      # once on four cores (they mostly wait: 150 s at four, 80 at eight);
      # every probe runs and reports even after another fails.
      - name: Native Linux probes
        if: ${{ !cancelled() && steps.native-fixtures.outcome == 'success' }}
        timeout-minutes: 15
        run: python3 scripts/linux_smokes.py --jobs 8
      # The tall menu's protocol trace, green or not (#1199): the order that
      # closed it as it opened is counted in its result.
      - name: Keep the Wayland popups trace
        if: ${{ !cancelled() && steps.native-fixtures.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wayland-popups-trace
          retention-days: 3
          if-no-files-found: ignore
          path: |
            /tmp/zgx-wayland-popups/sway-tall.trace
            /tmp/zgx-wayland-popups/result.json
      # What the job left free, beside the start's: a full disk loses the log.
      - if: always()
        run: df -h /
      - name: Preserve Vulkan and native window evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: linux-evidence
          path: |
            ${{ runner.temp }}/zgx-vulkan-tests.log
            /tmp/zgx-*
  # Exact instruction counts (cachegrind) of the CPU-only headless scenes
  # against the PR's base, as a PR comment; more than +1% fails. On main,
  # against the commit before (no failure), which also keeps its cache.
  perf:
    runs-on: ubuntu-latest
    # With the base's binaries not cached, both sides build: the head's took
    # 19 minutes and the base's was cut at 26 (Nov 7, as scenes grew); the
    # inlining check adds a MIR build of three crates.
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # As the linux job's: last month's .debs, and a stalled mirror fails
      # fast and retries (one held this step its whole 10 minutes, #491).
      - id: apt-key
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: apt-cache
        with:
          path: ~/apt-archives
          key: apt-perf-${{ runner.arch }}-${{ steps.apt-key.outputs.month }}
          restore-keys: apt-perf-${{ runner.arch }}-
      - name: Packages
        timeout-minutes: 10
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          if [ -d ~/apt-archives ]; then sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/; fi
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get update -qq $apt
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $apt valgrind cmake pkg-config fonts-dejavu-core libdbus-1-dev libfontconfig1-dev libwayland-dev libxcb1-dev libxkbcommon-dev libxrandr-dev
          mkdir -p ~/apt-archives && cp /var/cache/apt/archives/*.deb ~/apt-archives/
      - uses: actions/cache/save@v4
        if: steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      # The gate's target directory sits in the workspace's, so this keeps
      # its release dependencies (not zgx's crates, rebuilt either side):
      # about a minute and a half of each build.
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf-gate
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # What a pull request is measured against: the main commit its merge
      # ref (the checkout) was made on, its first parent; not base.sha,
      # where the branch left main, which a later main has passed: a PR
      # opened before main changed counted main's change as its own (#488
      # took #482's +1.25%). On main, the commit before.
      # Each binary is counted warm (gate.py's `warm`): run once uncounted,
      # with a cache directory of its own, before its first count.
      - name: Warm counting
        run: python3 scripts/perf/test_gate.py -v
      - name: Base
        id: base
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      # The head's binaries first: main keeps them by commit as soon as they
      # are built (the gate checks the compiler too), and a pull request
      # looks for its base's only once its own are, minutes after a merge
      # rather than at once, so it builds its side alone. One path for both,
      # as actions/cache keys include it.
      - name: Head binaries
        id: head
        env:
          ZGX_GATE_TARGET: target/perf-gate
          ZGX_GATE_BIN_CACHE: ${{ runner.temp }}/gate-bin
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          python3 scripts/perf/gate.py "$BASE" --stage head
          if [ -f "$ZGX_GATE_BIN_CACHE/built-from" ]; then echo "binaries=yes" >> "$GITHUB_OUTPUT"; fi
      # One chunk of a streamed Markdown reply costs the same at 800 sections
      # as at 100, within 1.25x, in zgx's own instructions (malloc's and
      # Luau's collector's move ±15% run to run: scripts/perf/flat_chunks.py; by phase,
      # crates/zgx-script/tests/md_chunk_flat.rs): a pull request that makes
      # it grow fails at the Gate step, as one the gate refuses does. The
      # step itself carries on, so a slow or broken one leaves the gate's
      # counts to run; one that never finished leaves no status, a failure.
      # Here, with the head's crates alone in the target: once the gate has
      # built the base there, cargo links the base's zgx with the head's
      # script crate, a compile error at best and at worst the base's engine
      # counted as the head's.
      - name: Streamed Markdown per chunk
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          ZGX_GATE_TARGET: target/perf-gate
        run: |
          chunk=0
          python3 scripts/perf/flat_chunks.py --markdown "$GITHUB_STEP_SUMMARY" || chunk=$?
          if [ "${{ github.event_name }}" != pull_request ]; then chunk=0; fi
          echo "chunk=$chunk" >> "$GITHUB_ENV"
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.head.outputs.binaries == 'yes'
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/gate-bin
          key: gate-bin-${{ github.sha }}
      - run: rm -rf "$RUNNER_TEMP/gate-bin"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gate-bin
          key: gate-bin-${{ steps.base.outputs.sha }}
      - name: Instruction counts
        env:
          ZGX_GATE_TARGET: target/perf-gate
          ZGX_GATE_BIN_CACHE: ${{ runner.temp }}/gate-bin
          # Cells that grew, explained by function (job log and artifact).
          ZGX_GATE_FUNCTIONS: ${{ runner.temp }}/gate-functions
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          status=0
          python3 scripts/perf/gate.py "$BASE" --stage run --markdown perf.md || status=$?
          if [ "${{ github.event_name }}" != pull_request ]; then status=0; fi
          cat perf.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "status=$status" >> "$GITHUB_ENV"
      - name: Functions
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gate-functions
          path: ${{ runner.temp }}/gate-functions
          if-no-files-found: ignore
          retention-days: 14
      - name: Comment
        if: github.event_name == 'pull_request' && hashFiles('perf.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file perf.md
      # Whether the hot functions in zgx, zgx-gpu and zgx-script still
      # inline what they did (scripts/perf/inline_scopes.py): a change far
      # from one can make rustc's MIR inliner give up on it (#1740) or pull
      # a callee into it (#1824). One MIR build of each crate, on the gate's
      # release dependencies; the base is built only on a failure, to name
      # the callees. On main, reported and not failing, as the gate. Skipped
      # when nothing those crates compile changed: their sources and the
      # crates they inline from (zgx-fx, zgx-components, zgx-3d, vendor/),
      # the lockfile and profiles, and the check itself.
      - name: Inlining
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          # The default shell (`bash -e`) has no pipefail: the check's status,
          # not tee's.
          set -o pipefail
          inline=0
          sources='^crates/zgx(-gpu|-script|-fx|-components|-3d)?/.*\.rs$|^vendor/.*\.rs$|^Cargo\.(lock|toml)$|^scripts/perf/inline_scopes\.'
          if ! git diff --name-only "$BASE" HEAD | grep -qE "$sources"; then
            echo "### Inlining: skipped, no change to what zgx, zgx-gpu and zgx-script compile" >> "$GITHUB_STEP_SUMMARY"
            echo "inline=0" >> "$GITHUB_ENV"
            exit 0
          fi
          start=$SECONDS
          python3 scripts/perf/inline_scopes.py --target target/perf-gate --base "$BASE" 2>&1 | tee inline.txt || inline=$?
          minutes=$(( (SECONDS - start + 30) / 60 ))
          { echo "### Inlining ($minutes min)"; echo '```'; cat inline.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" != pull_request ]; then inline=0; fi
          echo "inline=$inline" >> "$GITHUB_ENV"
      - name: Gate
        run: |
          if [ "$inline" != 0 ]; then echo "a hot function inlines differently: see Inlining"; fi
          if [ "${chunk:-1}" != 0 ]; then
            echo "A streamed Markdown chunk grew with the reply past 1.25x, or wasn't counted (the 'Streamed Markdown per chunk' step)."
            exit 1
          fi
          if [ "$status" != 0 ]; then exit "$status"; fi
          exit "$inline"
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p zgx -p zgx-components -p zgx-desktop -p zgx-workload --all-targets --locked
      # Text in every script, shaped in the system's own fonts.
      - run: cargo test -p zgx-gpu --test text_scripts --test editor_selection --locked
      - run: cargo test -p zgx-fx --locked
      # Terminal sessions on real ptys (openpty, ConPTY): exact cells, input, exits.
      - run: cargo test -p zgx-terminal --locked
      # The soak (an app used for a while holds what it did), on Metal.
      - run: cargo test -p zgx-script --test soak --locked
      - run: cargo test -p zgx-run --test audit --locked
      # The watchdog's budgets and memory limits, whose timing is each OS's,
      # one at a time: run together on the runner's three cores, five busy
      # tests kept the watchdog's thread off a core 130 ms (a runaway
      # stopped at 157 ms of CPU), as an app's few threads never do.
      - run: cargo test -p zgx-script --test state --locked -- --test-threads=1 script::runaway script::a_script_short_of_its_budget script::garbage_from_builtins script::copies_of_state script::a_script_keeping_nodes
      - run: cargo test --workspace --doc --locked
      # Without ffmpeg, the tests of what it encodes pass by skipping: here it
      # must be there.
      - name: Video
        if: ${{ !cancelled() }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install ffmpeg
          ffmpeg -version > /dev/null
          ffprobe -version > /dev/null
          cargo test -p zgx-video --locked
      - name: Metal rendering and damage readback
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/macos_native_validation.py --target-dir target --output "$RUNNER_TEMP/zgx-macos-parity" 2>&1 | tee "$RUNNER_TEMP/zgx-metal-tests.log"
      - name: Native component window lifecycle
        if: ${{ !cancelled() }}
        run: |
          cargo build -p zgx-desktop --example component_workload --locked
          python3 scripts/component_host_smoke.py target/debug/examples/component_workload --output "$RUNNER_TEMP/zgx-macos-host"
      # Keep textual diagnostics even if account artifact storage is exhausted.
      - name: Print Metal validation diagnostics
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          paths = sorted(path for directory in ("zgx-macos-parity", "zgx-macos-host")
                         for path in (root / directory).rglob("*"))
          for path in paths:
              if path.is_file() and path.suffix in (".log", ".json") and path.name not in ("source-diff.log", "source-files.json"):
                  print(f"::group::{path.name}", flush=True)
                  print(path.read_text(errors="replace"), flush=True)
                  print("::endgroup::", flush=True)
          PY
      - name: Preserve Metal and window evidence
        id: macos-evidence-upload
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: macos-gpu-evidence
          path: |
            ${{ runner.temp }}/zgx-metal-tests.log
            ${{ runner.temp }}/zgx-macos-host
            ${{ runner.temp }}/zgx-macos-parity
      - name: Report incomplete Metal artifact upload
        if: always() && steps.macos-evidence-upload.outcome == 'failure'
        run: echo "::warning::Metal artifact upload failed. Text diagnostics remain in job logs; downloadable evidence preservation is incomplete (check artifact quota). This is not native validation completion."
  # Compile everything and run the core unit tests; native Windows probes and
  # the GPU suite run on developer machines.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        # The merge's base too, for the Video step to see what changed.
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Clippy compiles what `cargo check` would, and lints the Windows-only
      # code Linux and macOS never build; WebView2 (off by default) with it.
      - run: cargo clippy --workspace --all-targets --features zgx-desktop/webview2 --locked -- -D warnings
      # zgx-script's unit tests (its file events wait on Windows' own
      # notifications) and its bundled script paths (caught a Windows
      # separator bug), in one run.
      - run: cargo test -p zgx -p zgx-components -p zgx-desktop -p zgx-script --lib --test components --test bundle --locked
      # Text in every script, shaped in the system's own fonts.
      - run: cargo test -p zgx-gpu --test text_scripts --test editor_selection --locked
      - run: cargo test -p zgx-fx --locked
      # Menus, popovers and tooltips in Windows' shapes there (WinUI's).
      - run: "cargo test -p zgx --test overlays --locked -- composition_menu::a_menu_takes_its_platforms_shape"
      # Focus drawn as Windows' focus visual there (outside the control,
      # two rings), as the Linux and macOS jobs test it inside.
      - run: "cargo test -p zgx --test input --locked -- focus_visible::"
      # And its scrollbars, as WinUI's: widening and narrowing on single wakes.
      - run: "cargo test -p zgx --test lists --locked -- overlay_scrollbars::"
      # And its menus closing at once when an item is chosen, no flash.
      - run: "cargo test -p zgx --test overlays --locked -- composition_menu::a_chosen_item_flashes_first_where_menus_do"
      # Scrolling with Windows' shapes: menu items spaced as WinUI's,
      # scrollbars with arrow buttons, a right-to-left view's thumb.
      - run: "cargo test -p zgx --test overlays --test lists --test layout --locked -- composition_menu_scroll:: composition_scrollbar:: rtl_scroll::"
      # Paths as Windows writes them: a file a script uploads, a test's
      # file and line the CLI names, and the reference's examples written
      # out with their plugins (`-- file: … (granted …)`).
      - run: "cargo test -p zgx-script --test state --test tooling --locked -- upload:: test_cli:: reference_docs::"
      # Terminal sessions on real ptys (openpty, ConPTY): exact cells, input, exits.
      - run: cargo test -p zgx-terminal --locked
      # The swap chain's alpha (opaque windows aren't blended by DWM, #513)
      # and the event loop's wake by an event handle (#478): Windows only.
      - run: cargo test -p zgx-desktop --test opaque_swap_chain --test proxy_wake --test early_context --locked
      - run: cargo test -p winit --lib --locked occlusion_area
      - run: cargo test -p winit --lib --locked hwnd_dpi_keeps_no_gdi_handles
      - run: cargo test -p winit --lib --locked a_deadline_already_armed_isnt_armed_again
      # A mouse message's Shift and Control, to a window without focus.
      - run: cargo test -p winit --lib --locked a_wheel_with_shift_down_has_shift_without_focus
      # The watchdog's budgets and memory limits, whose timing is each OS's,
      # one at a time: run together on the runner's three cores, five busy
      # tests kept the watchdog's thread off a core 130 ms (a runaway
      # stopped at 157 ms of CPU), as an app's few threads never do.
      - run: cargo test -p zgx-script --test state --locked -- --test-threads=1 script::runaway script::a_script_short_of_its_budget script::garbage_from_builtins script::copies_of_state script::a_script_keeping_nodes
      # The vendored accesskit_windows' tests of zgx's patches (UIA's
      # HeadingLevel, and a grid cell named by its text for Narrator;
      # vendor/accesskit_windows/ZGX_PATCH.md), alone: its other tests move
      # the foreground window. Built in the workspace's target, which shares
      # what it can of the build above.
      - run: cargo test --manifest-path vendor/accesskit_windows/Cargo.toml --target-dir target --locked -- heading cell_name find_text
      # Direct3D 12 on WARP (no GPU on the runner): pixel tests of what the
      # D3D shader compiler alone gets wrong (coarse derivatives, #38), the
      # device on DXGI's first low-power adapter (`adapter`, #217), every
      # shader module compiled by FXC optimizing as a release build does
      # (`every_shader`), and canvas strokes drawn: FXC once overflowed its
      # stack on the polyline module, which crashed apps on first draw; and an
      # app's own shaders compiled by FXC in a process of its own drawing
      # as wgpu builds them (`app_shaders_d3d12`). With an empty folder for
      # the shader cache, every shader compiles.
      - run: cargo test -p zgx-gpu --test borders --test transforms --test rounded_clip --test adapter --test shader_cache --test every_shader --test canvas --test box_model --test popup_backdrop --test app_shaders_d3d12 --locked
        env:
          LOCALAPPDATA: ${{ runner.temp }}\zgx-cold
          ZGX_EXPECT_COLD_CACHE: "1"
      # Tests that once failed on a real Windows GPU alone, which this job
      # never ran: a scaled layer reading its own texels (`layer_shader`),
      # and colour emoji drawn opaque (`color_glyphs`, `colour_layers`: Segoe
      # UI Emoji is COLR).
      - run: cargo test -p zgx-gpu --test layer_shader --test color_glyphs --test colour_layers --locked
      # Not `pixels`: on WARP two of its tests read text a level apart where a
      # real GPU reads it exact (`a_long_text_draws_only_the_lines_in_its_clip`,
      # `naturally_measured_streaming_rows_reflow_with_damage_and_stable_anchor`).
      # WARP's linear sampling lands a hair off a glyph's texel centres, so a
      # glyph copied by a scroll, or read from another atlas cell, differs by 1
      # in a channel. Metal and an RTX 4090 are exact, measured; reading texels
      # exactly instead cost 1-8% GPU on Metal or 0.6-1.2% CPU on fx cells, so
      # zgx doesn't pay it for a software rasterizer.
      # The app-shader HLSL generator's register map and the FXC child's
      # job and cache key (dx12_fill, fxc_child: Windows-only modules).
      - run: cargo test -p zgx-gpu --lib --locked -- dx12_fill fxc_child
      # Direct3D 11 (the `d3d11` feature, on WARP) draws what Direct3D 12
      # does, byte for byte: the suite's scenes and every ready-made shader
      # fill and layer shader, each compiled cold by FXC in its child
      # (`d3d11_parity`), optimized as apps ship them; and its ahead-compiled
      # shaders are what naga writes now.
      - run: cargo test -p zgx-gpu --features d3d11 --test d3d11_parity --test d3d11_left_out --release --locked
        env:
          LOCALAPPDATA: ${{ runner.temp }}\zgx-cold-d3d11
      - run: cargo test -p zgx-gpu --features d3d11 --lib --locked -- d3d11_frame
      # zgx-video's tests, as the linux and macOS jobs run them, with
      # ffmpeg (without it, the tests of what it encodes pass by skipping).
      # On a pull request only when it changes what zgx-video compiles:
      # its sources and the workspace crates it builds on (`cargo metadata`
      # says which), vendor/, the lockfile and this workflow; always on
      # main. Runner time is shared.
      - name: Video
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          sources='^crates/zgx(-video|-gpu|-script|-3d|-run|-desktop|-components|-fx|-terminal)?/|^comparisons/workload/|^vendor/|^Cargo\.(lock|toml)$|^\.github/workflows/ci\.yml$'
          if [ "${{ github.event_name }}" = pull_request ] && ! git diff --name-only HEAD^1 HEAD | grep -qE "$sources"; then
            echo "### Video: skipped, no change to what zgx-video compiles" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          start=$SECONDS
          choco install ffmpeg -y --no-progress > "$RUNNER_TEMP/ffmpeg-install.log" || { cat "$RUNNER_TEMP/ffmpeg-install.log"; exit 1; }
          echo "### Video: ffmpeg installed in $(( SECONDS - start )) s" >> "$GITHUB_STEP_SUMMARY"
          # choco's shims aren't always on this step's PATH once it's done
          # (ffmpeg not found, exit 127, on some runs): the folder of the
          # binaries it unpacked goes first, so the tests find ffmpeg.exe
          # and the ffprobe.exe beside it. None found fails the step: the
          # tests of what ffmpeg encodes would pass by skipping.
          choco_root=$(cygpath -u "${ChocolateyInstall:-C:\ProgramData\chocolatey}")
          found=$(find "$choco_root/lib/ffmpeg" -name ffmpeg.exe 2>/dev/null | head -n 1)
          dir=${found:+$(dirname "$found")}
          if [ -z "$dir" ] && [ -f "$choco_root/bin/ffmpeg.exe" ]; then dir="$choco_root/bin"; fi
          if [ -z "$dir" ] || [ ! -f "$dir/ffprobe.exe" ]; then
            echo "::error::choco installed ffmpeg, but no ffmpeg.exe with ffprobe.exe beside it is under $choco_root/lib/ffmpeg or $choco_root/bin: the video tests would skip what ffmpeg encodes"
            find "$choco_root/lib/ffmpeg" -maxdepth 4 2>/dev/null | head -n 40
            exit 1
          fi
          export PATH="$dir:$PATH"
          echo "### Video: ffmpeg from $dir" >> "$GITHUB_STEP_SUMMARY"
          [ "$(command -v ffmpeg)" = "$dir/ffmpeg" ] || [ "$(command -v ffmpeg)" = "$dir/ffmpeg.exe" ] || { echo "::error::ffmpeg resolves to '$(command -v ffmpeg)', not $dir"; exit 1; }
          ffmpeg -version > /dev/null
          ffprobe -version > /dev/null
          cargo test -p zgx-video --locked
