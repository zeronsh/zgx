[env]
# Test threads get Rust's 2 MiB stack; an app's main thread has 8 MiB. In
# debug builds the engine's mount and lowering recursion takes more than
# 2 MiB for the deepest example interfaces, so tests run with the main
# thread's stack.
RUST_MIN_STACK = "8388608"

# Luau checks its asserts unless NDEBUG is defined, and the cc crate that
# builds it never defines it: every script loop, call and table access
# paid for them in release builds (a fifth of a filter over a list). Debug
# builds keep them (luau0-src defines LUAU_ENABLE_ASSERT there).
LUAU_CXXFLAGS = "-DNDEBUG"

# What the iOS code needs (Liquid Glass is iOS 26's), and what Rust's linker
# needs told: its default, iOS 10, lacks symbols mimalloc's C links against.
# Read only when building for iOS.
IPHONEOS_DEPLOYMENT_TARGET = "26.0"
